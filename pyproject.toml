[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bf-opencore"
version = "3.0.0"
description = "BlueFlow open-core Django app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Virta Laboratories, Inc." }]

dependencies = [
    "celery<5.5",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-csv>=3.0",
    "drf-spectacular<=0.29",
    "netaddr>=0.10.0",
    "django-celery-beat",
    "django-filter",
    "django-jsx",
    "django-netfields",
    "django-simple-history",
    "django-waffle>=4.0",
    "dj-database-url",
    "psycopg[binary]>=3",
    "click>=8.3.1",
    "sh>=2.2.2",
    "python-nmap>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "model_bakery",
    "django-test-migrations",
    "freezegun>=1.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bf_opencore*", "project*"]

[tool.pytest.ini_options]
testpaths = ["tests", "bf_opencore/tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = ["django-stubs>=5.2.9"]
