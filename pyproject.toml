[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueflow"
version = "0.1.0"
description = "Blueflow Django app"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Virta Laboratories, Inc." }]

dependencies = [
    "celery<5.5",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-csv>=3.0",
    "drf-spectacular<=0.29",
    "netaddr>=0.10.0",
    "django-celery-beat",
    "django-filter",
    "django-jsx",
    "django-netfields",
    "django-simple-history",
    "django-waffle>=4.0",
    "dj-database-url",
    "psycopg[binary]>=3",
    "click>=8.3.1",
    "sh>=2.2.2",
    "python-nmap>=0.7.1",
    "requests>=2.32.5",
    "python-json-logger>=3.0",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0",
    "whitenoise>=6.0",
]
scanners = [
    "hl7>=0.4",
]
dev = [
    "pytest",
    "pytest-django",
    "pytest-xdist",
    "model_bakery",
    "django-test-migrations",
    "freezegun>=1.0,<3",
    "django-stubs[compatible-mypy]",
    "ruff",
    "pre-commit>=4.5.1",
    "pytest-json-report",
]

[project.scripts]
harness = "harness.orchestrator:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["blueflow*", "project*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests", "blueflow/tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
exclude = [".venv", "blueflow/migrations", "harness/.logs"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "DJ001", "RET504"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
"conftest.py" = ["S101"]
"harness/**" = ["T201", "S603", "S607", "PLR0913"]
"blueflow/models/asset.py" = ["DJ012", "FBT002", "S101", "SIM103", "SIM105", "SIM118", "SLF001"]
"blueflow/models/asset_manager.py" = ["B904", "C901", "EM101", "EM102", "EM103", "PLR0912", "RSE102", "S101", "SIM108", "SIM211", "SLF001", "TRY003", "TRY300"]
"blueflow/utils/fieldmap.py" = ["B904", "C901", "EM102", "PLR0911", "SIM118", "TRY003"]

[tool.ruff.format]
skip-magic-trailing-comma = false
