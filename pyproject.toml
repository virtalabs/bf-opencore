[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueflow"
version = "0.3.7"
description = "Blueflow Django app"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Virta Laboratories, Inc." }]

dependencies = [
    "celery<5.5",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular<=0.29",
    "netaddr>=0.10.0",
    "django-celery-beat",
    "django-filter",
    "django-jsx",
    "django-netfields",
    "django-simple-history",
    "dj-database-url",
    "psycopg[binary]>=3",
    "click>=8.3.1",
    "sh>=2.2.2",
    "python-nmap>=0.7.1",
    "requests>=2.32.5",
    "python-json-logger>=3.0",
    "redis>=7.4.0",
    "django-extensions>=4.1",
    "django-waffle>=5.0.0",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0",
    "whitenoise>=6.0",
]
scanners = [
    "hl7>=0.4",
]
dev = [
    "pytest",
    "pytest-django",
    "pytest-xdist",
    "model_bakery",
    "django-test-migrations",
    "freezegun>=1.0,<3",
    "django-stubs[compatible-mypy]",
    "ruff",
    "pre-commit>=4.5.1",
    "pytest-json-report",
    "bandit>=1.9.4",
]

[project.scripts]
harness = "harness.orchestrator:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["blueflow*", "project*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests", "blueflow/tests", "blueflow/celery/tests", "blueflow/zeek/hl7/tests"]
addopts = "-ra -m 'not contract'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "contract: excluded from default pytest; run with -m contract (see contracts.yml)",
    "integration: requires external tools (oasdiff, network, etc.)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
exclude = [".venv", "blueflow/migrations", "harness/.logs"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D211",
  "D213",
  "FIX002",
  "FLY002",
  "RET504",
  "TD003",
  "TRY300",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is fine in tests.
# ARG001: pytest fixtures are declared via argument list; the body doesn't
#         read them (they run for side effects like configuring celery or
#         loading fixture data), so ruff's "unused argument" check is a
#         false positive in test contexts.
"**test**" = ["S101", "ARG001", "PLR2004"]
"conftest.py" = ["S101", "PLR2004"]
"harness/**" = ["T201", "S603", "S607", "PLR0913"]
"**settings**" = ["LOG015", "SLF001"]
"spikes/**" = ["T201", "PLR2004", "S607", "S603"]
"scripts/**" = ["S101"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.bandit]
exclude = ["conftest.py"]
exclude_dirs = ["tests", "**/test**",]
