[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bf_opencore"
version = "3.0.0"
description = "BlueFlow open-core Django app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Virta Laboratories, Inc." }]

dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular<=0.29",
    "netaddr>=0.10.0",
]

[tool.setuptools.packages.find]
include = ["bf_opencore*"]