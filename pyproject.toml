[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bf-opencore"
version = "3.0.0"
description = "BlueFlow open-core Django app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Virta Laboratories, Inc." }]

dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blueflow*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]
