name: Test

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        run: uv run python project/manage.py migrate --noinput

      - name: Run tests
        run: >-
          uv run pytest
          --json-report
          --json-report-file=report.json
          -ra

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.json
