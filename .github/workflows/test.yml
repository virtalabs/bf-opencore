name: Test

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        run: uv run python project/manage.py migrate --noinput

      # Parallel via xdist for speed. --tb=no and -q keep output
      # to just FAILED lines + summary, which the agent harness
      # parses directly. pytest-json-report is incompatible with
      # xdist (WSGIRequest serialization crashes workers).
      #
      # TODO: Remove continue-on-error once baseline test failures
      # (~88 as of 2026-04-15) are resolved. The agent harness
      # detects the actual failure via check-run annotations.
      - name: Run tests
        continue-on-error: true
        run: uv run pytest -n auto -m "not contract" --tb=no -q --no-header -ra
