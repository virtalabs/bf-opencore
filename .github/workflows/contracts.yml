name: Contracts

on:
  push:
    branches: [develop, main, spike/contract-ci]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job(s) to run
        required: true
        default: all
        type: choice
        options:
          - all
          - verify
          - drift

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify TapirXL ingest contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'verify'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        run: uv run python project/manage.py migrate --noinput

      - name: Run TapirXL contract tests
        timeout-minutes: 8
        run: >-
          uv run pytest blueflow/tests/test_contract_tapirxl_ingest.py
          -v --tb=short

  drift:
    # Scheduled, manual, or spike-branch push (temporary — remove before merge to develop).
    name: Drift check — Viper payload vs live spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'all' || inputs.job == 'drift')) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/spike/contract-ci')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        run: uv run python project/manage.py migrate --noinput

      - name: Fetch Viper OpenAPI spec
        id: fetch_spec
        continue-on-error: true
        env:
          VIPER_OPENAPI_URL: ${{ vars.VIPER_OPENAPI_URL }}
          VIPER_API_TOKEN: ${{ secrets.VIPER_API_TOKEN }}
        run: |
          if [ -z "$VIPER_OPENAPI_URL" ]; then
            echo "VIPER_OPENAPI_URL not configured — skipping drift check"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTH_HEADER=()
          if [ -n "$VIPER_API_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${VIPER_API_TOKEN}")
          fi
          if ! curl -sf "${AUTH_HEADER[@]}" "$VIPER_OPENAPI_URL" -o /tmp/viper_openapi.json; then
            echo "::warning::Failed to fetch Viper openapi.json from ${VIPER_OPENAPI_URL}"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Validate Viper payload against live spec
        if: steps.fetch_spec.outputs.skipped != 'true'
        continue-on-error: true
        run: |
          uv run python project/manage.py emit_viper_sample --output /tmp/viper_sample.json
          if ! uv run python -m blueflow.contracts.check_viper_payload \
            --spec /tmp/viper_openapi.json \
            --sample /tmp/viper_sample.json; then
            echo "::warning::BlueFlow Viper payload failed contract validation against live spec"
            exit 1
          fi
