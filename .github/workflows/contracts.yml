name: Contracts

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job(s) to run
        required: true
        default: all
        type: choice
        options:
          - all
          - verify
          - drift

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Contract verification
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'verify' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations
        run: uv run python project/manage.py migrate --noinput

      - name: Slice Viper OpenAPI for Prism
        run: ./scripts/slice_viper_openapi.sh contracts/viper/openapi.json /tmp/viper-sliced.json

      - name: Start Prism mock
        run: |
          test -f /tmp/viper-sliced.json || { echo "Sliced spec missing" >&2; exit 1; }
          docker run -d --name viper-prism -p 4010:4010 \
            -v /tmp/viper-sliced.json:/spec/openapi.json:ro \
            stoplight/prism:4@sha256:08dc16243047a3263beca814b544a5be81e9ec25ca5757cdc4170c84f7431355 \
            mock -h 0.0.0.0 /spec/openapi.json
          ./scripts/wait_for_prism.sh http://127.0.0.1:4010/ viper-prism 60

      - name: Verify contract tests
        timeout-minutes: 8
        env:
          VIPER_PRISM_BASE_URL: http://127.0.0.1:4010
          VIPER_API_TOKEN: contract-test-token
        run: >-
          uv run pytest
          blueflow/tests/test_contract_tapirxl_ingest.py
          blueflow/tests/test_contract_viper_wire.py
          blueflow/tests/test_diff_viper_openapi.py
          -m "contract and not integration"
          -v --tb=short

      - name: Stop Prism mock
        if: always()
        run: docker rm -f viper-prism 2>/dev/null || true

  drift:
    name: Viper OpenAPI drift
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'drift' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueflow
          POSTGRES_PASSWORD: blueflow
          POSTGRES_DB: blueflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blueflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PINNED_SPEC: contracts/viper/openapi.json
      VIPER_OPENAPI_URL: ${{ vars.VIPER_OPENAPI_URL }}
      DATABASE_URL: postgresql://blueflow:blueflow@localhost:5432/blueflow
      DJANGO_SETTINGS_MODULE: project.settings.test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Fetch live Viper OpenAPI spec
        id: fetch_spec
        continue-on-error: true
        env:
          VIPER_API_TOKEN: ${{ secrets.VIPER_API_TOKEN }}
        run: |
          URL="${VIPER_OPENAPI_URL:-https://viper-xi.vercel.app/api/openapi.json}"
          AUTH_HEADER=()
          if [ -n "$VIPER_API_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${VIPER_API_TOKEN}")
          fi
          if ! curl -sf "${AUTH_HEADER[@]}" "$URL" -o /tmp/viper_live.json; then
            echo "::warning::Failed to fetch Viper openapi.json from ${URL}"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Check if live spec differs from pin
        id: spec_changed
        if: steps.fetch_spec.outputs.skipped != 'true'
        run: |
          if cmp -s "$PINNED_SPEC" /tmp/viper_live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Live spec matches committed pin — no update needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Live spec differs from committed pin"
          fi

      - name: Install oasdiff
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        run: |
          curl -fsSL \
            "https://github.com/oasdiff/oasdiff/releases/download/v1.19.1/oasdiff_1.19.1_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin oasdiff

      - name: Classify Viper OpenAPI drift
        id: classify_drift
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set +e
          uv run python -m blueflow.contracts.diff_viper_openapi \
            --baseline "$PINNED_SPEC" \
            --live /tmp/viper_live.json \
            --operation assets-processIntegrationCreate \
            > /tmp/oasdiff_output.txt 2>&1
          rc=$?
          cat /tmp/oasdiff_output.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 1 ]; then
            echo "::warning::Viper OpenAPI drift classification reported breaking changes"
          fi
          exit 0

      - name: Validate payload against live spec via Prism
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        continue-on-error: true
        env:
          VIPER_API_TOKEN: ${{ secrets.VIPER_API_TOKEN }}
        run: |
          ./scripts/slice_viper_openapi.sh /tmp/viper_live.json /tmp/viper-sliced.json
          test -f /tmp/viper-sliced.json || { echo "Sliced spec missing" >&2; exit 1; }
          docker rm -f viper-prism-drift 2>/dev/null || true
          docker run -d --name viper-prism-drift -p 4011:4010 \
            -v /tmp/viper-sliced.json:/spec/openapi.json:ro \
            stoplight/prism:4@sha256:08dc16243047a3263beca814b544a5be81e9ec25ca5757cdc4170c84f7431355 \
            mock -h 0.0.0.0 /spec/openapi.json
          ./scripts/wait_for_prism.sh http://127.0.0.1:4011/ viper-prism-drift 60
          export VIPER_PRISM_BASE_URL=http://127.0.0.1:4011
          export VIPER_API_TOKEN="${VIPER_API_TOKEN:-contract-test-token}"
          uv run python project/manage.py migrate --noinput
          uv run python project/manage.py emit_viper_sample --output /tmp/viper_sample.json
          if ! ./scripts/post_viper_sample_to_prism.sh /tmp/viper_sample.json; then
            echo "::warning::BlueFlow Viper payload failed Prism validation against live spec"
            docker rm -f viper-prism-drift 2>/dev/null || true
            exit 1
          fi
          docker rm -f viper-prism-drift 2>/dev/null || true

      - name: Update pinned OpenAPI spec
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        run: cp /tmp/viper_live.json "$PINNED_SPEC"

      - name: Prepare pull request body
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        env:
          SOURCE_URL: ${{ steps.fetch_spec.outputs.source_url }}
          OASDIFF_RC: ${{ steps.classify_drift.outputs.exit_code }}
        run: |
          {
            echo "Scheduled drift check detected a change in the live Viper OpenAPI spec."
            echo ""
            echo "**Source:** ${SOURCE_URL}"
            echo ""
            echo "**oasdiff exit code:** ${OASDIFF_RC} (1 = breaking changes for assets-processIntegrationCreate)"
            echo ""
            echo "**oasdiff output:**"
            echo '```'
            cat /tmp/oasdiff_output.txt
            echo '```'
            echo ""
            echo "_Automated by contracts.yml drift job._"
          } > /tmp/pr_body.md

      - name: Create pull request for pin update
        if: >-
          steps.fetch_spec.outputs.skipped != 'true' &&
          steps.spec_changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/viper-openapi-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(contracts): update Viper OpenAPI pin"
          title: "chore(contracts): update Viper OpenAPI pin"
          body-path: /tmp/pr_body.md
