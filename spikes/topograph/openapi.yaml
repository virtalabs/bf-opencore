openapi: 3.1.0

info:
  title: BlueFlow Topology API
  version: 0.1.0-minimal
  summary: Read-only network topology snapshot.
  description: |
    A network topology snapshot.

    Filter by `cidr`/`network` to scope to specific segments.
  contact:
    name: BlueFlow

servers:
  - url: http://localhost:8000/api
    description: Local Django development server.
  - url: http://localhost:4010
    description: Mock server

tags:
  - name: topology
    description: Network topology snapshots.

security:
  - tokenAuth: []

paths:
  /topology:
    get:
      operationId: getTopologySnapshot
      tags: [topology]
      summary: Get the current topology snapshot.
      description: |
        Returns the latest topology snapshot.

        Filter with `cidr` entries and `network` to scope to specific segments.
        An asset matches if any interface IP falls in a supplied CIDR. Multiple CIDRs are unioned.
        `edge_scope` governs boundary-crossing connections.
      parameters:
        - name: cidr
          in: query
          required: false
          style: form
          explode: true
          description: Restrict to assets with an interface IP in this CIDR. Repeatable.
          schema:
            type: array
            items:
              type: string
              description: IPv4 or IPv6 CIDR block.
          examples:
            single:
              summary: One segment
              value: ["10.10.1.0/24"]
            multiple:
              summary: Two segments (union)
              value: ["10.10.0.0/24", "10.10.1.0/24"]
        - name: network
          in: query
          required: false
          description: Named network whose CIDRs are added to the query.
          schema:
            type: string
        - name: edge_scope
          in: query
          required: false
          description: Connection-inclusion policy when filtering by CIDR.
          schema:
            $ref: "#/components/schemas/EdgeScope"
      responses:
        "200":
          description: A topology snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologySnapshot"
              examples:
                populated:
                  summary: A network across two segments
                  value:
                    schema_version: 0.1.0-minimal
                    snapshot_id: 6d3f8b2a-1c4e-4f9a-8b21-9f0c7a1e44d2
                    timestamp: "2026-06-30T14:05:00Z"
                    assets:
                      - id: 4211
                        hostname: PHILIPS-MX700-01
                        manufacturer: philips
                        category: patient_monitor
                        model: intellivue_mx700
                        app_sw_version: J.10.19
                        interfaces:
                          - mac_address: "00:1a:b1:10:01:11"
                            ipv4_address: 10.10.1.11
                            ipv6_address: null
                        services:
                          - port: 3702
                            protocol: udp
                            cast: multicast
                            service: ws_discovery
                      - id: 4212
