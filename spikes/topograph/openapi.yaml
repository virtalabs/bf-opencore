                        app_sw_version: 4.4.6
                        interfaces:
                          - mac_address: "00:1a:b1:10:01:41"
                            ipv4_address: 10.10.1.41
                            ipv6_address: null
                        services:
                          - port: 104
                            protocol: tcp
